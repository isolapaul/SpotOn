version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      root-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Node 24 runtime (D14): types must stay on 24.x.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint 10 breaks eslint-plugin-react (bundled by eslint-config-next 16.3.x).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler): typescript-eslint supports <6.1 and Next's type check uses the TS 6 API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # React 19 / zustand 5 are T31; mapbox-gl majors change the rendering (check the map by hand).
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mapbox-gl"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zustand"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/functions"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      functions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript 7: typescript-eslint supports <6.1 (same reason as the root).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    groups: { base-images: { patterns: ["*"] } }
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]   # Node major is a deliberate decision (D14, D17)
